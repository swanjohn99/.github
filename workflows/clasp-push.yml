name: Push to Google Apps Script

on:
  workflow_call:
    secrets:
      CLASPRC_JSON:
        required: true
        description: Contents of ~/.clasprc.json (Google OAuth token)

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install clasp
        run: npm ci

      - name: Write clasp auth credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing CLASPRC_JSON secret (org or repo)."
            exit 1
          fi
          if [ ! -f .clasp.json ]; then
            echo "Missing committed .clasp.json with project scriptId."
            exit 1
          fi
          if grep -q 'REPLACE_WITH_APPS_SCRIPT_PROJECT_ID' .clasp.json; then
            echo "Update .clasp.json scriptId before deploying."
            exit 1
          fi
          printf '%s\n' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push to Apps Script
        run: npx clasp push --force
