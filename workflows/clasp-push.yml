# .github/workflows/clasp-push.yml
name: Push to Google Apps Script
on:
  workflow_call:
    secrets:
      CLASPRC_JSON:
        required: true
      CLASP_JSON:
        required: true

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Write clasp credentials
        - name: Write clasp auth credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing CLASPRC_JSON secret (org or repo)."
            exit 1
          fi
          if [ ! -f .clasp.json ]; then
            echo "Missing committed .clasp.json with project scriptId."
            exit 1
          fi
          if grep -q 'REPLACE_WITH_APPS_SCRIPT_PROJECT_ID' .clasp.json; then
            echo "Update .clasp.json scriptId before deploying."
            exit 1
          fi
          printf '%s\n' "$CLASPRC_JSON" > ~/.clasprc.json
      - run: npx clasp push --force
